name: Production CI/CD

# Roda em 2 situações:
# 1. Pull Request de develop → main: apenas valida (source branch + security audit)
# 2. Push para main (após merge): security audit + aprovação manual + deploy efetivo
# Testes já foram validados em develop (Develop.yaml)
# O deploy NUNCA acontece durante o PR, somente após merge
# Deploy é do angular-app/ (Angular, SSR/prerender) na Vercel - antes da migração o site
# vinha pronto em public/ (Grunt); o Root Directory do projeto na Vercel também precisa
# apontar pra angular-app/ (configuração feita direto no dashboard da Vercel, fora do
# escopo deste arquivo).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy manual'
        required: false
        default: 'Deploy manual via workflow_dispatch'

# Permissões necessárias para criar e fazer push de tags
permissions:
  contents: write  # Necessário para criar tags e fazer push

jobs:
  # Validar se o PR vem de develop (apenas para PRs)
  validate-source:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check if PR comes from develop
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Source branch: $SOURCE_BRANCH"
          
          if [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "❌ BLOQUEADO: PRs para 'main' devem vir APENAS de 'develop'"
            echo "Branch atual: $SOURCE_BRANCH"
            echo ""
            echo "Workflow correto:"
            echo "1. Feature: feature/* → develop"
            echo "2. Release: develop → main"
            exit 1
          fi
          
          echo "✅ PR válido: develop → main"

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [validate-source]
    if: always() && (needs.validate-source.result == 'success' || needs.validate-source.result == 'skipped')
    defaults:
      run:
        working-directory: angular-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'angular-app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'angular-app/package-lock.json'

      - name: Install dependencies
        run: npm ci
      
      - name: Security audit
        run: |
          echo "🔒 Running npm audit..."
          npm audit --audit-level=high || true
          
          AUDIT_RESULT=$(npm audit --audit-level=high --json || true)
          HIGH_COUNT=$(echo $AUDIT_RESULT | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_COUNT=$(echo $AUDIT_RESULT | jq '.metadata.vulnerabilities.critical // 0')
          
          echo "⚠️  High vulnerabilities: $HIGH_COUNT"
          echo "🚨 Critical vulnerabilities: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ BLOCKED: Critical vulnerabilities detected!"
            exit 1
          fi
          
          if [ "$HIGH_COUNT" -gt 2 ]; then
            echo "⚠️  WARNING: More than 2 high vulnerabilities detected!"
            echo "Consider fixing before deploying to production."
            exit 1
          fi
          
          echo "✅ Security audit passed"
          echo ""
          echo "ℹ️  Testes já foram validados em develop"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-check
    # Roda APENAS após merge (push em main) ou workflow_dispatch
    # Durante PR apenas valida — nunca faz deploy
    #
    # CAUSA REAL, finalmente confirmada com prova (22/09/2026, via um job de diagnostico
    # temporario que imprimiu o contexto `github.*` cru): quando um job tem `needs:` e o
    # `if:` NAO comeca com `always()`, o GitHub Actions acrescenta, escondido, um
    # `success()` na frente da condicao - e esse `success()` olha pra CADEIA INTEIRA de
    # dependencias, nao so pro job listado direto em `needs:`. A cadeia aqui e
    # deploy-production -> security-check -> validate-source; `validate-source` fica
    # "skipped" em todo push pra main (so roda em pull_request), e "skipped" NAO conta
    # como sucesso pra esse `success()` implicito - ele envenena a cadeia toda, mesmo
    # com security-check tendo realmente dado certo. Por isso a condicao (mesmo depois
    # de corrigida de bloco multi-linha pra uma linha so, e depois simplificada) sempre
    # pulava o job: faltava `always()` no inicio, exatamente como `security-check` ja
    # tinha (pelo mesmo motivo, um nivel acima). Confirmado com um job sem `if`/`needs`
    # que imprimiu `github.ref == 'refs/heads/main'` = `true` isolado, provando que o
    # valor em si sempre esteve certo - o problema era so a cadeia implicita de needs.
    if: always() && needs.security-check.result == 'success' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: https://www.johnnysouto.com.br
    defaults:
      run:
        working-directory: angular-app

    steps:
      # `working-directory: .` sobrescreve o `defaults.run.working-directory: angular-app`
      # do job (22/09/2026, erro real em produção: "No such file or directory" - este
      # step roda ANTES do checkout abaixo, então `angular-app/` ainda não existe no
      # runner nesse ponto; como o step só imprime contexto do GitHub, sem tocar em
      # nenhum arquivo do projeto, rodar na raiz do workspace resolve sem precisar
      # reordenar nada).
      - name: Debug - Show GitHub Context
        working-directory: .
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Should deploy: TRUE (job is running)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'angular-app/.nvmrc'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Deploy to Vercel Production
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Production URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Notify deployment success
        run: |
          echo "✅ Deployed to Production"
          echo "🔗 URL: ${{ steps.deploy.outputs.url }}"
          echo "📦 Environment: Production"
          echo "🌿 Branch: main"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "📅 Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

  post-deploy-validation:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    # `always()` necessario pelo mesmo motivo de "deploy-production" acima: sem ele, o
    # `success()` implicito olharia pra cadeia inteira (incluindo `validate-source`,
    # sempre "skipped" em push pra main) e pularia este job mesmo com deploy-production
    # tendo dado certo.
    if: always() && needs.deploy-production.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for deployment propagation
        run: sleep 10
      
      - name: Health check - API endpoints
        run: |
          echo "🔍 Running health checks..."
          
          # Tentar acessar a URL de produção
          PRODUCTION_URL="https://www.johnnysouto.com.br"
          
          echo "Testing $PRODUCTION_URL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $PRODUCTION_URL)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Homepage is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Homepage returned HTTP $HTTP_CODE"
            echo "This might be expected if redirects are configured."
          fi
          
          echo "✅ Smoke tests completed"
      
      - name: Notify validation success
        run: |
          echo "✅ Post-deploy validation completed"
          echo "🎉 Production deployment successful and validated!"
          echo ""
          echo "Next steps:"
          echo "1. Monitor logs in Vercel Dashboard"
          echo "2. Test critical user flows manually"
          echo "3. Check error tracking (if configured)"
          echo "4. Review performance metrics"

  notify-failure:
    name: Notify Deployment Failure
    runs-on: ubuntu-latest
    needs: [security-check, deploy-production, post-deploy-validation]
    if: failure()
    
    steps:
      - name: Create failure notification
        run: |
          echo "❌ DEPLOYMENT FAILED"
          echo "🔍 Check the logs above for details"
          echo ""
          echo "Possible causes:"
          echo "- Security vulnerabilities detected"
          echo "- Vercel deployment error"
          echo "- Post-deploy validation failed"
          echo ""
          echo "Action required: Review logs and fix issues before retrying."
          echo ""
          echo "ℹ️  Testes já foram validados em develop/preproduction"

  create-version-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deploy-validation]
    # `always()` necessario pelo mesmo motivo dos 2 jobs acima.
    if: always() && needs.deploy-production.result == 'success' && needs.post-deploy-validation.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para ter acesso a todas as tags
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'angular-app/.nvmrc'

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./angular-app/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $VERSION"
      
      - name: Check if tag already exists
        id: check-tag
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          TAG="v$VERSION"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist, will create"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Configure Git
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create and push tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.check-tag.outputs.tag }}"
          
          git tag -a "$TAG" -m "chore(release): version ${{ steps.package-version.outputs.version }}

          Released to Production via GitHub Actions
          
          Deploy URL: https://www.johnnysouto.com.br
          Commit: ${{ github.sha }}
          Deployed by: ${{ github.actor }}
          Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          git push origin "$TAG"
          
          echo "✅ Tag $TAG created and pushed successfully"
      
      - name: Notify tag creation
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          TAG="${{ steps.check-tag.outputs.tag }}"
          EXISTS="${{ steps.check-tag.outputs.exists }}"
          
          if [ "$EXISTS" == "true" ]; then
            echo "ℹ️  Tag $TAG already exists, skipping creation"
            echo "🔗 View tag: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          else
            echo "🏷️  Tag created: $TAG"
            echo "📦 Version: $VERSION"
            echo "🔗 View tag: https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo ""
            echo "💡 Tip: Create a release from this tag in GitHub:"
            echo "   https://github.com/${{ github.repository }}/releases/new?tag=$TAG"
          fi