name: Angular App CI

# Pipeline minimo do novo projeto Angular (docs/PLANO-MIGRACAO-ANGULAR.md, Fase 1).
# Roda so quando algo dentro de angular-app/ muda, e nao interfere em nada
# do pipeline legado (Develop.yaml/Production.yaml), que continua cuidando
# só de src/ e public/ ate o corte de producao (Fase 8 do plano).
# Escopo aqui e so validar que o projeto compila (build) — sem deploy,
# sem publicar preview: isso fica para uma fase futura do plano.
on:
  push:
    paths:
      - 'angular-app/**'
      - '.github/workflows/Angular-App-CI.yaml'
  pull_request:
    paths:
      - 'angular-app/**'
      - '.github/workflows/Angular-App-CI.yaml'

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'angular-app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'angular-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
