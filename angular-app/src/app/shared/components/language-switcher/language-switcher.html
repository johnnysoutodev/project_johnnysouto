@if (layout() === 'inline') {
  <div
    class="language-switcher language-switcher--inline"
    role="group"
    aria-label="Idioma"
    i18n-aria-label="@@language.switcher.aria"
  >
    @for (locale of language.locales; track locale.code) {
      <button
        type="button"
        class="language-switcher__option"
        [attr.lang]="locale.code"
        [attr.aria-pressed]="locale.code === language.current.code"
        (click)="choose(locale)"
      >
        {{ locale.name }}
      </button>
    }
  </div>
} @else {
  <div class="language-switcher">
    <select
      class="language-switcher__select"
      aria-label="Idioma"
      i18n-aria-label="@@language.switcher.aria"
      (change)="onChange($event)"
    >
      @for (locale of language.locales; track locale.code) {
        <option
          [value]="locale.code"
          [attr.lang]="locale.code"
          [selected]="locale.code === language.current.code"
        >
          {{ locale.name }}
        </option>
      }
    </select>
    <svg
      class="language-switcher__chevron"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M6 9l6 6 6-6" />
    </svg>
  </div>
}
