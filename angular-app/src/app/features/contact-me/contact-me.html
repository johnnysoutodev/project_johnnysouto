<section class="contact-me">
  <div class="contact-me__container">
    <div class="contact-me__heading">
      <app-tag>Entre em contato</app-tag>
      <p class="contact-me__subtitle">Prefira o canal que for mais conveniente para você:</p>
    </div>

    <!-- Coluna central (design-system.md secao 8.12): email + telefone empilhados, nao lado a lado. -->
    <div class="contact-me__central">
      <div class="contact-me__row contact-me__row--email">
        <img
          class="contact-me__row-icon"
          ngSrc="/assets/icons/icon-mail.svg"
          width="32"
          height="32"
          alt=""
        />
        <a class="contact-me__row-value" [href]="mailtoHref">{{ email }}</a>
        <app-icon-button
          size="large"
          [ariaLabel]="copiedField() === 'email' ? 'Email copiado!' : 'Copiar email'"
          (click)="copy('email', email)"
        >
          @if (copiedField() === 'email') {
            <!-- Feedback temporario de "copiado" - icone generico inline (nao ha
                 checkmark exportado do Figma pra esse estado, spec 8.12/8.3 so cobre o
                 estado default do Icon Button). -->
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          } @else {
            <img ngSrc="/assets/icons/icon-copy.svg" width="32" height="32" alt="" />
          }
        </app-icon-button>
      </div>

      <div class="contact-me__row contact-me__row--phone">
        <img
          class="contact-me__row-icon"
          ngSrc="/assets/icons/icon-phone.svg"
          width="32"
          height="32"
          alt=""
        />
        <a
          class="contact-me__row-value"
          [href]="phoneHref"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ phoneDisplay }}
        </a>
        <app-icon-button
          size="large"
          [ariaLabel]="copiedField() === 'phone' ? 'Telefone copiado!' : 'Copiar telefone'"
          (click)="copy('phone', phoneDisplay)"
        >
          @if (copiedField() === 'phone') {
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          } @else {
            <img ngSrc="/assets/icons/icon-copy.svg" width="32" height="32" alt="" />
          }
        </app-icon-button>
      </div>
    </div>

    <div class="contact-me__social">
      <p class="contact-me__social-text">Você também pode me encontrar por aqui:</p>

      <!--
        Icon Button so-icone pros 2 links, mesmo padrao do Hero (08/09/2026, a pedido do
        Johnny: agora que o LinkedIn tambem tem icone proprio, nao precisa mais do texto
        da URL visivel ao lado - o icone sozinho ja deixa claro qual link e qual, sem a
        ambiguidade que motivava o texto visivel antes de o LinkedIn ganhar icone).
      -->
      <div class="contact-me__links">
        <app-icon-button [href]="githubUrl" ariaLabel="GitHub de Johnny Souto (abre em nova aba)">
          <img ngSrc="/assets/icons/icon-social-github.svg" width="24" height="24" alt="" />
        </app-icon-button>

        <app-icon-button
          [href]="linkedinUrl"
          ariaLabel="LinkedIn de Johnny Souto (abre em nova aba)"
        >
          <img ngSrc="/assets/icons/icon-social-linkedin.svg" width="24" height="24" alt="" />
        </app-icon-button>
      </div>
    </div>
  </div>
</section>
