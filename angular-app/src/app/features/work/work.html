<section class="work">
  <div class="work__container">
    <div class="work__heading">
      <app-tag>Projetos</app-tag>
      <p class="work__subtitle">Alguns dos projetos dos quais fiz parte:</p>
    </div>

    <div class="work__list">
      @for (project of projects; track project.name) {
        <article class="work__card">
          <!--
            Lado da imagem vira bloco neutro (design-system.md secao 10: projetos
            corporativos internos, sem material de divulgacao/thumbnail real disponivel) -
            sem `<img>` de placeholder ficticio do template.
          -->
          <div class="work__image" aria-hidden="true"></div>

          <div class="work__content">
            <div class="work__heading-group">
              <h3 class="work__title">{{ project.name }}</h3>
              <p class="work__period">{{ project.period }}</p>
            </div>
            <p class="work__description">{{ project.description }}</p>

            <div class="work__tags">
              @for (tag of project.tags; track tag) {
                <app-tag>{{ tag }}</app-tag>
              }
            </div>

            @if (project.actionHref) {
              <div class="work__actions">
                <app-icon-button [href]="project.actionHref" [ariaLabel]="project.actionAriaLabel!">
                  <!--
                    Icone generico de "link externo" - nao ha icone especifico exportado
                    do Figma pra essa acao (design-system.md secao 6/8.5 nao cobrem o
                    icone interno do Icon Button do card de projeto), mesma convencao ja
                    usada no icone de tema/menu do Header (placeholder inline comentado
                    como tal).
                  -->
                  <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                    <path d="M15 3h6v6" />
                    <path d="M10 14 21 3" />
                  </svg>
                </app-icon-button>
              </div>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
