<section class="skills">
  <div class="skills__container">
    <div class="skills__heading">
      <app-tag i18n="@@skills.tag">Skills</app-tag>
      <!--
        `<h2>`, nao `<p>` (26/09/2026, achado do PageSpeed - auditoria de ordem de
        headings): era paragrafo simples, pulava do H1 (Hero) direto pro H3 (About/itens),
        sem heading nenhum pra secao. Visual identico (`.skills__subtitle` ja reseta
        margem/fonte via classe, nao depende da tag).
      -->
      <h2 class="skills__subtitle" i18n="@@skills.subtitle">
        <!--
          Traducao/adaptacao livre do subtitulo do Figma ("The skills, tools and
          technologies I am really good at:", secao 8.10) - o curriculo legado nao tinha
          esse heading; mesma convencao de "copy adaptada" ja usada no Hero/About.
        -->
        As tecnologias e ferramentas com as quais eu trabalho
      </h2>
    </div>

    <div class="skills__row">
      @for (item of items; track item.label) {
        <div class="skills__item">
          <div class="skills__item-icon" aria-hidden="true">
            @if (item.icon) {
              <img
                [ngSrc]="item.icon"
                [width]="item.iconWidth ?? 64"
                height="64"
                alt=""
                [class.skills__item-icon-img--invert-dark]="item.invertOnDark"
              />
            }
          </div>
          <span class="skills__item-label">{{ item.label }}</span>
        </div>
      }
    </div>
  </div>
</section>
