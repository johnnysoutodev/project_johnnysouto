<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Johnny Souto | Engenheiro de Software</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Favicon: monograma "JS" (mesmo texto curto do logo do Header, layout/header/header.html)
      sobre fundo escuro fixo (--color-gray-900 do tema claro) - nao acompanha o dark mode do
      SITE (isso e sobre o conteudo da pagina; o favicon fica na aba do navegador, que tem seu
      proprio chrome claro/escuro independente) - a pedido do Johnny (22/09/2026), substitui o
      favicon padrao do Angular CLI (o escudo rosa/roxo do `ng new`, nunca trocado ate aqui). SVG
      primeiro (nitido em qualquer tamanho); `.ico` como fallback pra navegadores sem suporte a
      `image/svg+xml` em `rel="icon"`.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Preload da imagem LCP (foto da Hero, hero.html) - antecipa a busca desse arquivo pro
      quanto antes no carregamento, antes do parser HTML chegar no <img> ou de qualquer JS
      rodar (26/09/2026, achado do PageSpeed Insights: mesmo com `priority`/fetchpriority=high
      do NgOptimizedImage, a auditoria "Atraso no carregamento de recursos" do LCP ainda
      apontava um delta a reduzir). Mesmo arquivo nas 3 pastas de idioma, path relativo
      identico ao `ngSrc` do hero.html.
    -->
    <link
      rel="preload"
      as="image"
      href="assets/images/profile_johnnysouto.webp"
      fetchpriority="high"
    />
    <!--
      SEO por idioma: title/description/canonical/og:* sao definidos por idioma em
      `core/seo/seo.ts` (o Angular nao processa `i18n` no index.html); os valores abaixo sao
      so o padrao (pt-BR) caso o JS/prerender nao rode. `hreflang` e igual em todos os idiomas
      (lista completa + x-default apontando para a raiz, que redireciona pelo idioma do
      navegador - ver vercel.json).
    -->
    <meta
      name="description"
      content="Sou um profissional de TI com mais de 20 anos de experiência, atuando desde suporte técnico, bancos de dados, front-end, back-end, análise de negócios, implantando, configurando e prestando consultoria de sistemas a diversas empresas."
    />
    <link rel="alternate" hreflang="pt-BR" href="https://www.johnnysouto.com.br/pt-br/" />
    <link rel="alternate" hreflang="en-US" href="https://www.johnnysouto.com.br/en-us/" />
    <link rel="alternate" hreflang="es-ES" href="https://www.johnnysouto.com.br/es-es/" />
    <link rel="alternate" hreflang="x-default" href="https://www.johnnysouto.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Johnny Souto" />
    <meta
      property="og:title"
      content="Johnny Souto | Engenheiro de Software"
      i18n-content="@@seo.title"
    />
    <!--
      JPEG dedicado (26/09/2026) - a foto em si na Hero foi convertida pra `.webp` (menor,
      usada por `NgOptimizedImage`), mas crawlers de preview social (WhatsApp, Facebook,
      LinkedIn) tem suporte inconsistente a WebP em og:image, entao og:image aponta pra
      esta copia JPEG dedicada em vez do arquivo `.webp` da pagina.
    -->
    <meta
      property="og:image"
      content="https://www.johnnysouto.com.br/pt-br/assets/images/profile_johnnysouto_og.jpeg"
    />
    <!-- Fonte "Inter" (docs/design-system.md secao 4) - Google Font padrao, sem arquivo local -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Anti-FOUC do dark mode: aplica `data-theme` no <html> ANTES do primeiro paint,
      lendo a escolha salva (localStorage) ou, na ausencia, `prefers-color-scheme`.
      Sem isso, o site prerenderizado (SSG) sempre pintaria em light e só corrigiria
      pro tema real depois da hidratacao do Angular (ThemeService, core/theme/theme.ts),
      causando um flash visivel pra quem usa dark. Risco ja registrado em
      docs/PLANO-MIGRACAO-ANGULAR.md (secao 6, "Riscos e mitigacao").
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia indisponivel (ex.: modo privado restrito) - fica no
          // light padrao definido em :root (src/styles/_tokens.scss), sem quebrar o load.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <!--
      Google Analytics (GA4) - movido pra cá, no `index.html`, central e fora do Angular
      (22/09/2026, a pedido do Johnny). Antes vivia num `AnalyticsService` injetado no
      construtor do componente `App` - rodava dentro do ciclo de vida e da zona do
      Angular (zone.js), separadamente em cada build de idioma, e mesmo com o código
      idêntico ao `acceptGA()` do site legado (measurement ID certo, `window.gtag`
      global, `window['ga-disable-<ID>'] = false`), o hit de pageview nunca era
      enviado de verdade - confirmado com visitas reais, não só em teste. Igual ao
      script anti-FOUC do tema logo acima (a mesma ideia: algo que precisa rodar de
      forma central e previsível, sem depender do bootstrap do Angular), e igual ao
      site legado (`src/js/analytics.js`/`acceptGA()`, script no fim do body de cada
      página) - roda direto aqui, antes/independente da hidratação do Angular, e é
      idêntico nas 3 pastas de idioma (não é gerado por `i18n`, é o mesmo HTML puro
      nas 3), então não "segue o idioma" da forma errada que o serviço antigo seguia.
    -->
    <script>
      (function () {
        var host = location.hostname;
        if (host !== 'www.johnnysouto.com.br' && host !== 'johnnysouto.com.br') {
          return; // preview da Vercel, localhost etc. - nunca manda dado real
        }
        window['ga-disable-G-YYR4SND80L'] = false;
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-YYR4SND80L', {
          cookie_domain: 'johnnysouto.com.br',
          cookie_expires: 60 * 60 * 24 * 90,
          cookie_update: false,
        });
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-YYR4SND80L';
        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
